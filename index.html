<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Línea de Boxes — Noticias de Automovilismo</title>
<meta name="description" content="Fórmula 1, Franco Colapinto, Turismo Carretera, TC2000, Fórmula 2/3, Automovilismo Zonal y MotoGP. Todas las noticias, en una sola pista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     TOKENS — paleta tomada del logo (negro, blanco hueso y rojo)
     ============================================================ */
  :root{
    --bg:        #0a0a0b;
    --bg-alt:    #131315;
    --card:      #16161a;
    --line:      #262529;
    --white:     #f3efe4;
    --muted:     #928d80;
    --red:       #e01230;
    --red-dark:  #900d20;
    --red-glow:  rgba(224,18,48,.28);
    --header-bg: rgba(10,10,11,.94);
    --maxw:      1180px;
  }

  /* ---- modo claro ---- */
  html[data-theme="light"]{
    --bg:        #f6f3ec;
    --bg-alt:    #ffffff;
    --card:      #ffffff;
    --line:      #e3ded1;
    --white:     #17140f;
    --muted:     #6b6558;
    --red-glow:  rgba(224,18,48,.14);
    --header-bg: rgba(246,243,236,.92);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family:'Barlow', sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s ease, color .2s ease;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--red);color:#fff;}

  h1,h2,h3,.display{
    font-family:'Anton', 'Barlow Condensed', sans-serif;
    font-weight:400;
    letter-spacing:.01em;
    line-height:.98;
    margin:0;
  }

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}

  /* motivo de banderita a cuadros, reutilizado del isotipo */
  .checker{
    display:inline-flex;flex-wrap:wrap;
    width:16px;height:16px;
    flex:none;
  }
  .checker span{width:8px;height:8px;}
  .checker span:nth-child(1){background:var(--white);}
  .checker span:nth-child(2){background:var(--red);}
  .checker span:nth-child(3){background:var(--red);}
  .checker span:nth-child(4){background:var(--white);}

  /* ============================================================
     HEADER + NAV (las pestañas son la navegación entre secciones)
     ============================================================ */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    transition:background-color .2s ease, border-color .2s ease;
  }
  .header-inner{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:14px 28px;
    max-width:var(--maxw);margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:none;}
  .brand img{height:40px;width:auto;}

  .theme-toggle{
    appearance:none;cursor:pointer;flex:none;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);
    color:var(--white);
    transition:border-color .15s ease, background-color .2s ease, color .2s ease;
  }
  .theme-toggle:hover{border-color:var(--red);}
  .theme-toggle svg{width:18px;height:18px;display:block;}

  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
  nav::-webkit-scrollbar{display:none;}
  nav button{
    appearance:none;border:none;background:none;cursor:pointer;
    white-space:nowrap;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.03em;
    color:var(--muted);
    padding:8px 12px;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav button:hover{color:var(--white);}
  nav button.active{color:var(--white);border-color:var(--red);}

  /* ============================================================
     PANELES — cada sección es independiente: se muestra una sola
     por vez, no hay scroll largo con todas apiladas.
     ============================================================ */
  .panel{display:none;}
  .panel.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* --- panel Inicio --- */
  .hero{
    position:relative;
    padding:64px 0 40px;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,255,255,.025) 38px 39px),
      radial-gradient(700px 320px at 85% 0%, var(--red-glow), transparent 70%);
    pointer-events:none;
  }
  .hero-inner{position:relative;}
  .hero-eyebrow{
    display:flex;align-items:center;gap:10px;
    color:var(--red);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:14px;letter-spacing:.06em;
    margin-bottom:16px;
  }
  .hero h1{
    font-size:clamp(40px,7vw,84px);
    color:var(--white);
    max-width:14ch;
  }
  .hero h1 em{font-style:normal;color:var(--red);}
  .hero p{
    margin:18px 0 0;max-width:52ch;color:var(--muted);
    font-size:18px;line-height:1.5;
  }
  .hero-stripe{
    margin-top:34px;height:10px;background:var(--red);
    clip-path:polygon(0 0,96% 0,100% 100%,0% 100%);
    max-width:560px;
  }

  .featured{padding:44px 0 64px;}
  .featured-head{margin-bottom:20px;}
  .featured-head h2{font-size:26px;color:var(--white);}
  .featured-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:980px){.featured-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.featured-grid{grid-template-columns:1fr;}}

  .featured-card{
    background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--red);
    padding:18px 18px 20px;min-height:150px;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:transform .15s ease, border-color .15s ease;
  }
  .featured-card:hover{transform:translateY(-2px);border-left-color:var(--white);}
  .fc-tag{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    font-size:12px;letter-spacing:.05em;color:var(--red);
  }
  .fc-title{font-weight:600;font-size:17px;line-height:1.3;margin-top:8px;color:var(--white);}
  .fc-date{margin-top:14px;font-size:13px;color:var(--muted);}
  .featured-empty,.featured-error{color:var(--muted);font-size:15px;border:1px dashed var(--line);padding:22px;}

  .quick-links{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;
  }
  @media (max-width:980px){.quick-links{grid-template-columns:repeat(2,1fr);}}
  .quick-links button{
    appearance:none;cursor:pointer;text-align:left;
    background:var(--card);border:1px solid var(--line);color:var(--white);
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;
    padding:16px 16px;display:flex;align-items:center;gap:10px;
    transition:border-color .15s ease;
  }
  .quick-links button:hover{border-color:var(--red);}
  .quick-links img{height:22px;width:auto;flex:none;}

  /* --- panel de categoría --- */
  .category-panel{padding:48px 0 64px;}
  .cat-head{display:flex;align-items:center;gap:14px;margin-bottom:30px;flex-wrap:wrap;}
  .cat-head h2{font-size:clamp(26px,4vw,40px);color:var(--white);}
  .cat-head .cat-logo{height:44px;width:auto;flex:none;}
  .cat-count{
    font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--muted);
    border:1px solid var(--line);padding:4px 10px;margin-left:auto;
  }

  .news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:900px){.news-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.news-grid{grid-template-columns:1fr;}}

  .news-card{
    display:block;background:var(--card);border:1px solid var(--line);
    position:relative;padding:22px 20px 20px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    transition:border-color .15s ease, transform .15s ease;
  }
  .news-card:hover{border-color:var(--red);transform:translateY(-2px);}
  .news-card .nc-date{
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--red);
  }
  .news-card .nc-title{font-size:18px;font-weight:600;line-height:1.32;color:var(--white);margin-top:10px;}
  .news-card .nc-cta{
    display:inline-block;margin-top:16px;
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;
    color:var(--muted);border-top:1px solid var(--line);padding-top:12px;width:100%;
  }
  .news-card:hover .nc-cta{color:var(--white);}

  .state-msg{color:var(--muted);font-size:15px;padding:26px 0;}
  .state-msg.error{color:var(--red);}

  .skeleton{background:var(--card);border:1px solid var(--line);height:150px;position:relative;overflow:hidden;}
  .skeleton::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
    animation:shine 1.4s infinite;
  }
  @keyframes shine{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

  /* ============================================================
     FOOTER
     ============================================================ */
  footer{border-top:1px solid var(--line);padding:36px 0 44px;}
  .footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .footer-inner img{height:26px;opacity:.85;}

  /* ============================================================
     TRANSICIÓN ENTRE SECCIONES — un auto cruza la pantalla
     ============================================================ */
  .race-transition{
    --car-w:280px;          /* ancho del auto */
    --car-start:calc(-1 * (var(--car-w) + 330px)); /* estela + auto quedan fuera de pantalla al arrancar */
    position:fixed;inset:0;z-index:999;
    pointer-events:none;overflow:hidden;
    opacity:0;
  }
  .race-transition::before{
    content:"";position:absolute;inset:0;
    background:var(--bg);opacity:0;
  }
  .race-transition.playing{opacity:1;}
  .race-transition.playing::before{animation:rtFlash 2.1s cubic-bezier(.4,0,.2,1) forwards;}

  .race-stripe{
    position:absolute;top:50%;left:0;width:100%;height:6px;
    margin-top:-3px;background:var(--red);
    box-shadow:0 0 22px 4px var(--red-glow);
    transform:scaleX(0);transform-origin:left;
  }
  .race-transition.playing .race-stripe{animation:rtStripe 2.1s cubic-bezier(.4,0,.2,1) forwards;}

  .race-car-wrap{
    position:absolute;top:50%;left:var(--car-start);
    display:flex;align-items:center;gap:0;
    transform:translateY(-50%);
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.6));
  }
  .race-transition.playing .race-car-wrap{animation:rtCar 2.1s linear forwards;}

  .race-trail{height:7px;border-radius:2px;opacity:.9;filter:blur(.5px);}
  .race-trail:nth-child(1){width:100px;margin-right:-6px;background:linear-gradient(90deg,transparent,var(--red));}
  .race-trail:nth-child(2){width:150px;margin-right:-6px;margin-top:20px;background:linear-gradient(90deg,transparent,var(--white));opacity:.65;}
  .race-trail:nth-child(3){width:70px;margin-right:-6px;margin-top:-22px;background:linear-gradient(90deg,transparent,var(--white));opacity:.55;}
  .race-car{display:block;width:var(--car-w);height:auto;flex:none;user-select:none;-webkit-user-drag:none;}
  .race-car[hidden]{display:none;}
  @media (max-width:600px){ .race-transition{--car-w:200px;} }

  @keyframes rtCar{
    0%  {left:var(--car-start);}
    100%{left:calc(100% + 80px);}
  }
  @keyframes rtStripe{
    0%  {transform:scaleX(0);transform-origin:left;}
    48% {transform:scaleX(1);transform-origin:left;}
    56% {transform:scaleX(1);transform-origin:right;}
    100%{transform:scaleX(0);transform-origin:right;}
  }
  @keyframes rtFlash{
    0%  {opacity:0;}
    30% {opacity:.55;}
    62% {opacity:.55;}
    100%{opacity:0;}
  }
  footer p{color:var(--muted);font-size:13px;margin:0;}

</style>
</head>
<body>

<!-- Overlay de transición entre secciones: un auto cruza la pantalla -->
<div class="race-transition" id="raceTransition" aria-hidden="true">
  <div class="race-stripe"></div>
  <div class="race-car-wrap">
    <span class="race-trail"></span>
    <span class="race-trail"></span>
    <span class="race-trail"></span>
  </div>
</div>

<header>
  <div class="header-inner">
    <button class="brand" data-goto="inicio" aria-label="Ir a Inicio" style="background:none;border:none;padding:0;cursor:pointer;">
      <img id="brandLogo" alt="Línea de Boxes">
    </button>
    <nav id="mainNav">
      <!-- generado por JS a partir de CONFIG.categories -->
    </nav>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema"></button>
  </div>
</header>

<main>

  <!-- ============ PANEL: INICIO ============ -->
  <section class="panel active" id="panel-inicio" data-panel="inicio">
    <div class="hero">
      <div class="wrap hero-inner">
        <div class="hero-eyebrow">
          <span class="checker"><span></span><span></span><span></span><span></span></span>
          AUTOMOVILISMO, AL DETALLE
        </div>
        <h1>Todo el automovilismo,<br>en <em>una sola línea</em>.</h1>
        <p>Fórmula 1, Franco Colapinto, Turismo Carretera, TC2000, Fórmula 2/3, Automovilismo Zonal y MotoGP.</p>
        <div class="hero-stripe"></div>
      </div>
    </div>

    <div class="wrap featured">
      <div class="featured-head"><h2>Últimas noticias</h2></div>
      <div id="featuredGrid" class="featured-grid">
        <div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>

      <div class="featured-head" style="margin-top:48px;"><h2>Secciones</h2></div>
      <div id="quickLinks" class="quick-links"></div>
    </div>
  </section>

  <!-- ============ PANELES DE CATEGORÍA (generados por JS) ============ -->
  <div id="categoryPanels"></div>

</main>

<footer>
  <div class="wrap footer-inner">
    <img id="footerLogo" alt="Línea de Boxes">
    <p>Línea de Boxes — La página del automovilismo.</p>
  </div>
</footer>

/* ================================================================
   MODO CLARO / OSCURO
   ================================================================ */
const THEME_KEY = "lb-theme";
const themeToggle = document.getElementById("themeToggle");

const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>`;

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  // el ícono muestra la acción disponible: en modo oscuro, ícono de sol (pasar a claro) y viceversa
  themeToggle.innerHTML = theme === "light" ? ICON_MOON : ICON_SUN;
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
if (!savedTheme) {
  savedTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
}
applyTheme(savedTheme);

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "light" ? "dark" : "light");
});

  panel.dataset.panel = cat.id;
  panel.innerHTML = `
    <div class="wrap category-panel">
      <div class="cat-head">
        <span class="cat-logo-slot"></span>
        <h2>${cat.label}</h2>
        <span class="cat-count" id="count-${cat.id}">—</span>
      </div>
      <div class="news-grid" id="grid-${cat.id}">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  `;
  panelsRoot.appendChild(panel);

  const logoSlot = panel.querySelector(".cat-logo-slot");
  if (cat.logo) {
    logoSlot.innerHTML = `<img class="cat-logo" src="${cat.logo}" alt="${cat.label}">`;
  } else {
    logoSlot.innerHTML = `<span class="checker"><span></span><span></span><span></span><span></span></span>`;
  }

  const qb = document.createElement("button");
  qb.dataset.goto = cat.id;
  qb.innerHTML = (cat.logo ? `<img src="${cat.logo}" alt="">` : "") + `<span>${cat.label}</span>`;
  qb.addEventListener("click", () => showPanel(cat.id));
  quickLinks.appendChild(qb);
});

/* Ajuste de tamaño por auto (1 = ancho normal). Sirve para autos más altos/compactos que el resto. */
const RACE_CAR_SCALE = { zonal: 0.62 };
const raceCars = {};
Object.entries(RACE_VEHICLES).forEach(([key, src]) => {
  const img = new Image();
  img.className = "race-car";
  img.alt = "";
  img.draggable = false;
  img.hidden = true;
  if (RACE_CAR_SCALE[key]) img.style.width = "calc(var(--car-w) * " + RACE_CAR_SCALE[key] + ")";
  img.src = src;   // se cargan todas de entrada, así al cambiar de sección no hay parpadeo
  raceOverlay.querySelector(".race-car-wrap").appendChild(img);
  raceCars[key] = img;
});

function applyPanel(id) {
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.dataset.panel === id));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.goto === id));
  history.replaceState(null, "", id === "inicio" ? "#" : "#" + id);
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  currentPanelId = id;
}

function playRaceTransition(id, onHalfway) {
  let carKey;
  if (id === "inicio") {
    // Al volver a Inicio, mostramos el auto de una sección al azar (nunca el genérico)
    const otherKeys = Object.keys(raceCars).filter(key => key !== "default");
    carKey = otherKeys.length
      ? otherKeys[Math.floor(Math.random() * otherKeys.length)]
      : "default";
  } else {
    carKey = raceCars[id] ? id : "default";       // auto de la sección a la que vamos
  }
  Object.entries(raceCars).forEach(([key, img]) => { img.hidden = key !== carKey; });
  raceOverlay.classList.remove("playing");
  void raceOverlay.offsetWidth; // fuerza reflow para poder reiniciar la animación
  raceOverlay.classList.add("playing");
  window.setTimeout(onHalfway, 960);              // el auto tapa la pantalla: acá cambiamos el contenido
  window.setTimeout(() => raceOverlay.classList.remove("playing"), 2160);
}

function showPanel(id) {
  if (id === currentPanelId) return;
  // sin animación solo en la primera carga de la página
  if (currentPanelId === null) {
    applyPanel(id);
    return;
  }
  playRaceTransition(id, () => applyPanel(id));
}

document.getElementById("brandLogo").closest("button").addEventListener("click", () => showPanel("inicio"));

const initial = (location.hash || "").replace("#", "");
showPanel(initial && (initial === "inicio" || CONFIG.categories.some(c => c.id === initial)) ? initial : "inicio");

/* ================================================================
   DATOS: leer los PDF de cada carpeta vía la API de GitHub
   ================================================================
   Convención de nombre de archivo recomendada para que las noticias
   se ordenen solas por fecha:

     AAAA-MM-DD-Titulo-de-la-noticia.pdf
     ej: 2026-09-22-Colapinto-largara-noveno-en-Singapur.pdf

   Si un PDF no sigue esa convención, igual se muestra (al final de
   la lista, sin fecha), usando el nombre del archivo como título.
   ================================================================ */

const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})[-_ ]+(.+)\.pdf$/i;

function parseNewsItem(file, cat) {
  const match = file.name.match(DATE_RE);
  let date = null;
  let title;

  if (match) {
    const [, y, m, d, rest] = match;
    date = new Date(Number(y), Number(m) - 1, Number(d));
    title = rest.replace(/[-_]+/g, " ").trim();
  } else {
    title = file.name.replace(/\.pdf$/i, "").replace(/[-_]+/g, " ").trim();
  }

  return {
    title: title.charAt(0).toUpperCase() + title.slice(1),
    date,
    category: cat.label,
    url: file.html_url,
  };
}

function formatDate(d) {
  if (!d) return "";
  return d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
}

async function fetchCategory(cat) {
  const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodeURIComponent(cat.folder)}?ref=${CONFIG.branch}`;
  const res = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });

  if (res.status === 404) return []; // la carpeta todavía no existe / está vacía
  if (!res.ok) throw new Error(`GitHub API respondió ${res.status}`);

  const files = await res.json();
  if (!Array.isArray(files)) return [];

  const items = files
    .filter(f => f.type === "file" && /\.pdf$/i.test(f.name))
    .map(f => parseNewsItem(f, cat));

  items.sort((a, b) => {
    if (a.date && b.date) return b.date - a.date;
    if (a.date) return -1;
    if (b.date) return 1;
    return a.title.localeCompare(b.title, "es");
  });

  return items;
}

function renderCategory(cat, items) {
  const grid = document.getElementById(`grid-${cat.id}`);
  const count = document.getElementById(`count-${cat.id}`);
  count.textContent = items.length === 1 ? "1 noticia" : `${items.length} noticias`;

  if (items.length === 0) {
    grid.innerHTML = `<p class="state-msg">Aún no hay noticias.</p>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <a class="news-card" href="${item.url}" target="_blank" rel="noopener">
      ${item.date ? `<div class="nc-date">${formatDate(item.date)}</div>` : ""}
      <div class="nc-title">${item.title}</div>
      <span class="nc-cta">Leer noticia (PDF)</span>
    </a>
  `).join("");
}

function renderCategoryError(cat) {
  const grid = document.getElementById(`grid-${cat.id}`);
  const count = document.getElementById(`count-${cat.id}`);
  count.textContent = "—";
  grid.innerHTML = `<p class="state-msg error">No se pudieron cargar las noticias de esta sección. Revisá que el repositorio en CONFIG y la carpeta "${cat.folder}" existan y sean públicos.</p>`;
}

function renderFeatured(allItems) {
  const featuredGrid = document.getElementById("featuredGrid");
  const withDate = allItems.filter(i => i.date);
  const top = withDate.sort((a, b) => b.date - a.date).slice(0, 4);

  if (top.length === 0) {
    featuredGrid.innerHTML = `<p class="featured-empty">Aún no hay noticias.</p>`;
    return;
  }

  featuredGrid.innerHTML = top.map(item => `
    <a class="featured-card" href="${item.url}" target="_blank" rel="noopener">
      <div>
        <div class="fc-tag">${item.category}</div>
        <div class="fc-title">${item.title}</div>
      </div>
      <div class="fc-date">${formatDate(item.date)}</div>
    </a>
  `).join("");
}

async function init() {
  const allItems = [];

  const results = await Promise.allSettled(
    CONFIG.categories.map(cat => fetchCategory(cat))
  );

  results.forEach((result, i) => {
    const cat = CONFIG.categories[i];
    if (result.status === "fulfilled") {
      renderCategory(cat, result.value);
      allItems.push(...result.value);
    } else {
      renderCategoryError(cat);
      console.error(`Error cargando "${cat.label}":`, result.reason);
    }
  });

  renderFeatured(allItems);
}

init();
</script>
